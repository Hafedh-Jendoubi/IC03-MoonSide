name: CI – Backend

on:
  push:
    branches: ['feature/**']
    paths: ['Backend/**']
  pull_request:
    branches: [dev, main]
    paths: ['Backend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - { name: eureka,               path: Backend/Eureka,               java: 21 }
          - { name: gateway,              path: Backend/Gateway,              java: 21 }
          - { name: user-service,         path: Backend/User-Service,         java: 17, mongo: true }
          - { name: media-service,        path: Backend/Media-Service,        java: 17, mongo: true }
          - { name: organization-service, path: Backend/Organization-Service, java: 17, mongo: true }
          - { name: post-service,         path: Backend/Post-Service,         java: 17, mongo: true }
          - { name: notification-service, path: Backend/Notification-Service, java: 17, mongo: true, kafka: true }
          - { name: badge-service,        path: Backend/Badge-Service,        java: 17, mongo: true, kafka: true }
          - { name: search-service,       path: Backend/Search-Service,       java: 17, elastic: true }

    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
          MONGO_INITDB_DATABASE: admin
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        ports: [2181:2181]
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports: [9092:9092]
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 5

      elasticsearch:
        image: elasticsearch:8.13.0
        ports: [9200:9200]
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 15s --health-timeout 10s --health-retries 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.service.java }}
          distribution: temurin
          cache: maven

      - working-directory: ${{ matrix.service.path }}
        env:
          MONGO_ROOT_USERNAME: admin
          MONGO_ROOT_PASSWORD: admin123
          MONGODB_HOST: localhost
          MONGO_PORT: 27017
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: 9200
          SPRING_PROFILES_ACTIVE: test
        run: |
          chmod +x mvnw
          ./mvnw verify -B
