# Server
server.port=8086

# Application
spring.application.name=notification-service

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:https://moonside-eureka.onrender.com/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# JWT (shared secret with user-service)
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Kafka Aiven
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}
spring.kafka.properties.ssl.truststore.type=${SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.properties.ssl.truststore.certificates=${SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES}

spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=tn.moonside.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=tn.moonside.notificationservice.event.NotificationEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka topics
kafka.topic.notifications=notifications-events

# Logging
logging.level.tn.moonside.notificationservice=DEBUG
logging.level.org.springframework.security=INFO

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

# Disable MVC async request timeout so SSE streams stay open indefinitely
spring.mvc.async.request-timeout=-1

# Tomcat keep-alive for long-lived SSE connections
server.tomcat.connection-timeout=600000
