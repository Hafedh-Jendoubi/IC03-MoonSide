# Server
server.port=8084

# Application
spring.application.name=organization-service

# MongoDB
# Accepts a full connection string (works for both local docker Mongo and
# MongoDB Atlas SRV URIs), same pattern as user-service. For local
# docker-compose, set SPRING_DATA_MONGODB_URI to:
#   mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/org_db?authSource=admin
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin123}@${MONGODB_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_ORG_DATABASE:org_db}?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# Elasticsearch (global search index sync — see search/TeamSearchSyncListener)
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}


# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:https://moonside-eureka.onrender.com/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# JWT (shared secret with user-service)
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# User-Service base URL (for feign / RestTemplate calls to fetch user info)
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}

# Logging
logging.level.tn.moonside.organizationservice=DEBUG
logging.level.org.springframework.security=INFO