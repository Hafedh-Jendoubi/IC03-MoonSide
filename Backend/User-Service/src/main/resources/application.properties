# Server
server.port=8081

# Application
spring.application.name=user-service

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Elasticsearch (global search index sync — see search/UserSearchSyncListener)
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}


# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:https://moonside-eureka.onrender.com/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# JWT
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Logging
logging.level.com.moonside.user_service=DEBUG
logging.level.org.springframework.security=INFO
# ── Email (Brevo transactional email API) ─────────────────────────────────────
# Sent over HTTPS (port 443) instead of raw SMTP, since Render's free tier blocks
# outbound SMTP ports (25/465/587). spring.mail.username is reused here as the
# "from" address — it must be added and verified as a Sender in your Brevo account.
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
brevo.api-key=${BREVO_API_KEY:}

# ── App metadata ──────────────────────────────────────────────────────────────
app.name=${APP_NAME:WorkSphere}

# ── Redis (OTP storage for email-verification & password-reset) ──────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Upstash (and most managed Redis providers) require TLS on their public endpoint.
# Without this, Lettuce connects in plaintext and Upstash drops the connection
# immediately, surfacing as "Connection closed prematurely".
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Cap how long send() will block waiting for broker metadata — keeps the producer
# from hanging even if called from the HTTP thread. Background publish means this
# is a belt-and-suspenders safeguard only.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
kafka.topic.notifications=notifications-events
