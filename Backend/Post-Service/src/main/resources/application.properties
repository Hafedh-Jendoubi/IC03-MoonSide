# Server
server.port=8085

# Application
spring.application.name=post-service


# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true


# Elasticsearch Bonsai
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}


# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:https://moonside-eureka.onrender.com/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}


# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


# JWT
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}


# Used by OrganizationClient to verify team/dept leadership for edit authorization.
services.organization-service.url=${ORGANIZATION_SERVICE_URL:http://localhost:8084}
# Used by AuditClient to forward audit log entries to the User-Service.
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}


# Logging
logging.level.tn.moonside.postservice=DEBUG
logging.level.org.springframework.security=INFO


# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false


# MinIO / S3-compatible storage (Backblaze B2 in prod, local MinIO in dev)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:media-files}
# Only needed for B2 (e.g. eu-central-003); leave blank for local MinIO
minio.region=${MINIO_REGION:}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}


# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB


# Kafka Aiven
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:SASL_SSL}

spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:SCRAM-SHA-256}

spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}

spring.kafka.properties.ssl.truststore.type=${SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE:PEM}

spring.kafka.properties.ssl.truststore.certificates=${SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES}


spring.kafka.producer.properties.max.block.ms=5000

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


spring.kafka.admin.fail-fast=false

# Kafka topics
kafka.topic.notifications=notifications-events


# Redis Upstash
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

spring.data.redis.timeout=2000ms

spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

spring.cache.type=redis