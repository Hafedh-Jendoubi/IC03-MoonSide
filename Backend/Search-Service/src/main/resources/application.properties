# Server
server.port=8087

# Application
spring.application.name=search-service

# Elasticsearch
# Other services (User/Post/Organization) write into these indices; this
# service only ever reads from them.
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT (shared secret with user-service)
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}

# Logging
logging.level.tn.moonside.searchservice=DEBUG
logging.level.org.springframework.security=INFO
