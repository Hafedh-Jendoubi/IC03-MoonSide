# Server
server.port=8082

# Application
spring.application.name=media-service

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:https://moonside-eureka.onrender.com/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# JWT (same secret as User-Service so this service can validate tokens)
jwt.secret=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}

# MinIO / S3-compatible storage (Backblaze B2 in prod, local MinIO in dev)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:media-files}
# Only needed for B2 (e.g. eu-central-003); leave blank for local MinIO
minio.region=${MINIO_REGION:}

# Public base URL of THIS app, used to build the links we hand back to the
# frontend (e.g. https://your-gateway.onrender.com). The bucket is private;
# files are served through our own /media/file/** endpoint, not directly
# from B2.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Multipart – allow up to 10 MB per upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB